---
# Exclusions are applied once, from .coverignore, before upload.
coverage:
  precision: 2
  round: down
  range: "50...100"
  status:
    project:
      default:
        target: auto
    patch:
      default:
        target: auto

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
